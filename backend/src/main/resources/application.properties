# APPLICATION
spring.application.name=backend


# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# SQLITE DATABASE
# ==========================================
spring.datasource.url=jdbc:sqlite:../database/usermanager.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# ==========================================
# HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# JWT SECURITY
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# ==========================================
# DEFAULT ADMIN
# ==========================================
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12}

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ==========================================
# METRICS
# ==========================================
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==========================================
# LOGGING LEVELS
# ==========================================
logging.level.root=INFO
logging.level.com.usermanager.backend=INFO

# ==========================================
# STRUCTURED LOGGING JSON
# ==========================================
logging.structured.format.console=logstash
logging.structured.format.file=logstash

# ==========================================
# LOG FILE
# ==========================================
logging.file.name=logs/backend.log

# ==========================================
# LOG ROTATION
# ==========================================
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ==========================================
# ERROR HANDLING
# ==========================================
server.error.include-message=never
server.error.include-stacktrace=never
