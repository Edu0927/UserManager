name: UserManager - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  automated-tests:

    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JWT_SECRET: ci-test-secret-usermanager-12345678901234567890
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: Admin@12
      API_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:4200
      SPRING_PROFILES_ACTIVE: test
      CI: true

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: Preparar base de datos de pruebas
        run: |
          mkdir -p database
          mkdir -p backend/logs

      - name: Compilar backend
        working-directory: backend
        run: mvn clean package -DskipTests -B

      - name: Iniciar backend
        working-directory: backend
        run: |
          nohup java -jar target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:sqlite:../database/usermanager-ci.db \
            > backend-ci.log 2>&1 &

      - name: Esperar backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/health; then
              echo "Backend disponible"
              exit 0
            fi
            sleep 5
          done

          cat backend/backend-ci.log
          exit 1

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Iniciar frontend
        working-directory: frontend
        run: |
          nohup npx ng serve \
            --host 127.0.0.1 \
            --port 4200 \
            --prebundle=false \
            > frontend-ci.log 2>&1 &

      - name: Esperar frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4200 > /dev/null; then
              echo "Frontend disponible"
              exit 0
            fi
            sleep 5
          done

          cat frontend/frontend-ci.log
          exit 1

      - name: Instalar dependencias de pruebas
        working-directory: tests
        run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas backend - Jest y Supertest
        id: backend-tests
        working-directory: tests
        run: npm run test:backend

      - name: Ejecutar pruebas frontend - Playwright
        id: frontend-tests
        if: ${{ !cancelled() && steps.backend-tests.outcome != 'skipped' }}
        working-directory: tests
        run: npm run test:frontend

      - name: Guardar reportes backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            tests/jest-report/
            tests/jest-results/
          retention-days: 15

      - name: Guardar reportes frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 15

      - name: Guardar logs de ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: |
            backend/backend-ci.log
            backend/logs/
            frontend/frontend-ci.log
          retention-days: 15

  deployment:

    name: Despliegue automatico AWS EC2
    runs-on: ubuntu-latest
    needs: automated-tests

    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    timeout-minutes: 40

    concurrency:
      group: usermanager-production
      cancel-in-progress: false

    steps:

      - name: Autorizar despliegue
        env:
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Todas las pruebas finalizaron correctamente."
          echo "Despliegue autorizado."
          echo "Commit: $COMMIT"
          echo "Rama: $BRANCH"
          echo "Usuario: $ACTOR"

      - name: Desplegar aplicacion en AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 30m
          envs: DEPLOY_COMMIT

          script: |
            set -e

            cd /home/ubuntu/UserManager

            echo "======================================"
            echo "INICIANDO DESPLIEGUE USERMANAGER"
            echo "======================================"

            echo "Commit autorizado: $DEPLOY_COMMIT"

            echo "Verificando repositorio..."

            if [ -n "$(git status --porcelain)" ]; then
              echo "Existen cambios locales sin guardar."
              exit 1
            fi

            echo "Descargando cambios desde GitHub..."
            git fetch origin main

            if [ "$(git rev-parse origin/main)" != "$DEPLOY_COMMIT" ]; then
              echo "Existe un commit mas reciente."
              echo "Despliegue cancelado."
              exit 1
            fi

            git merge --ff-only "$DEPLOY_COMMIT"

            echo "Validando configuracion Docker..."
            docker compose config --quiet

            echo "Construyendo backend..."
            docker compose build backend

            echo "Construyendo frontend..."
            docker compose build frontend

            echo "Actualizando contenedores..."
            docker compose up -d --wait --wait-timeout 180

            echo "Verificando backend..."
            docker compose exec -T backend curl -fsS \
              http://localhost:8080/api/health

            echo "Verificando frontend..."
            curl -fsS http://localhost/ > /dev/null

            echo "Estado de los servicios..."
            docker compose ps

            echo "======================================"
            echo "DESPLIEGUE FINALIZADO CORRECTAMENTE"
            echo "======================================"

      - name: Confirmar despliegue
        run: |
          echo "UserManager desplegado correctamente en AWS EC2."