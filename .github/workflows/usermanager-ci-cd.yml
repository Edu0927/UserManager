
name: UserManager - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  automated-tests:

    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JWT_SECRET: ci-test-secret-usermanager-12345678901234567890
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: Admin@12
      API_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:4200
      SPRING_PROFILES_ACTIVE: test
      CI: true

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: Preparar base de datos de pruebas
        run: |
          mkdir -p database
          mkdir -p backend/logs

      - name: Compilar backend
        working-directory: backend
        run: mvn clean package -DskipTests -B

      - name: Iniciar backend
        working-directory: backend
        run: |
          nohup java -jar target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:sqlite:../database/usermanager-ci.db \
            > backend-ci.log 2>&1 &

      - name: Esperar backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/health; then
              echo "Backend disponible"
              exit 0
            fi
            sleep 5
          done

          cat backend/backend-ci.log
          exit 1

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Iniciar frontend
        working-directory: frontend
        run: |
          nohup npx ng serve \
            --host 127.0.0.1 \
            --port 4200 \
            --prebundle=false \
            > frontend-ci.log 2>&1 &

      - name: Esperar frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4200 > /dev/null; then
              echo "Frontend disponible"
              exit 0
            fi
            sleep 5
          done

          cat frontend/frontend-ci.log
          exit 1

      - name: Instalar dependencias de pruebas
        working-directory: tests
        run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas backend - Jest y Supertest
        id: backend-tests
        working-directory: tests
        run: npm run test:backend

      - name: Ejecutar pruebas frontend - Playwright
        id: frontend-tests
        if: ${{ !cancelled() && steps.backend-tests.outcome != 'skipped' }}
        working-directory: tests
        run: npm run test:frontend

      - name: Guardar reportes backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            tests/jest-report/
            tests/jest-results/
          retention-days: 15

      - name: Guardar reportes frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 15

      - name: Guardar logs de ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: |
            backend/backend-ci.log
            backend/logs/
            frontend/frontend-ci.log
          retention-days: 15

  validation:

    name: Validacion para despliegue
    runs-on: ubuntu-latest
    needs: automated-tests

    steps:

      - name: Autorizar siguiente etapa
        run: |
          echo "Todas las pruebas finalizaron correctamente."
          echo "El proyecto esta autorizado para despliegue."
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Usuario: ${{ github.actor }}"
